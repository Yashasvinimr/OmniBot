
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="shortcut icon" href="https://chatgpt.com/favicon.ico" type="image/x-icon">
    <title>New Chat</title>
    <style>
        body {
        overflow-y: auto; /* Enable vertical scrolling for the entire page */
    }
        .right2 {
            display: none;
        }

        .chat-container {
            flex: 1;
        overflow-y: auto;
        padding: 20px 0;
        max-height: calc(100vh - 100px); /* Adjust the maximum height */
        max-width: calc(100% - 40px); 
            word-wrap: break-word;
        }

        .right2 {
         display: flex;
        flex-direction: column;
        justify-content: center; /* Center the content vertically */
        align-items: center; /* Center the content horizontally */
        padding: 40px; /* Add padding */
        }

        .chat-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px 0;
            max-width: calc(100% - 40px); /* Limit the width of the chat content */
        }

        .chat-input {
            position: fixed;
            bottom: 0;
            left: 40px; /* Adjust left position */
            width: calc(100% - 60px); /* Adjust width */
            padding: 20px;
            background-color: #202123;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }

        .chat-input input {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: none;
            outline: none;
            background-color: #3a3a3a;
            color: white;
        }

        .chat-input button {
            background-color: #3a3a3a;
            border: none;
            padding: 10px;
            margin-left: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-input button svg {
            color: white;
        }

        .chat-box {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .chat-box img {
            border-radius: 50%;
            margin-right: 10px;
        }

        .chat-box.question {
            justify-content: flex-start;
        }

        .chat-box.answer {
            justify-content: flex-end;
        }

        .chat-box .chat-text {
            background-color: #3a3a3a;
            padding: 10px;
            border-radius: 5px;
            max-width: 600px;;
            color: white;
            word-wrap: break-word;
        }
        .chat-box.question .chat-text {
            max-width: 600px; /* Adjust padding */
            min-width: auto; /* Remove min-width */
            width: auto;
            word-wrap: break-word; /* Remove fixed width */
        }

        .chat-box.answer .chat-text {
            max-width: 600px; /* Adjust padding */
            min-width: auto; /* Remove min-width */
            width: auto;
            word-wrap: break-word; /* Remove fixed width */
        }
    </style>
</head>

<body class="bg-chatblack-50">
    <div class="flex  h-[100vh] text-white">
        <div class="right1 py-10 pl-96 m-10 w-fit flex justify-self-center  flex-col">
            <div class="text-center w-full text-4xl font-bold my-10">
                OmniBot
            </div>
            <div class="itemsrow flex py-4 w-[43vw] justify-around">
                <div class="examples flex flex-col justify-center items-center">
                    <svg stroke="currentColor" fill="none" stroke-width="1.5" viewBox="0 0 24 24" stroke-linecap="round"
                        stroke-linejoin="round" class="h-6 w-6" height="1em" width="1em"
                        xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <div class="py-2">Examples</div>
                    <button
                        class="bg-gray-600 w-[13vw] text-sm hover:bg-gray-700 py-4 px-4 mx-4 my-2 rounded-md">Explain
                        quantum computing in simple terms</button>
                    <button
                        class="bg-gray-600 w-[13vw] text-sm hover:bg-gray-700 py-4 px-4 mx-4 my-2 rounded-md">What exactly is artificial intelligence, and how does it affect our daily lives?.</button>
                    <button
                        class="bg-gray-600 w-[13vw] text-sm hover:bg-gray-700 py-4 px-4 mx-4 my-2 rounded-md">What are some recent advancements in space exploration, and how do they benefit humanity</button>

                </div>
                <div class="cap flex flex-col justify-center items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" aria-hidden="true" class="h-6 w-6">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75z"></path>
                    </svg>
                    <div class="py-2">Capabilities</div>
                    <button
                        class="bg-gray-600 w-[13vw] text-sm hover:bg-gray-700 py-4 px-4 mx-4 my-2 rounded-md">Despite its memory constraint, the chatbot efficiently adapts to the immediate context of conversations, ensuring relevant replies based on recent prompts.</button>
                    <button
                        class="bg-gray-600 w-[13vw] text-sm hover:bg-gray-700 py-4 px-4 mx-4 my-2 rounded-md"> Automatic deletion of past interactions after three prompts safeguards user privacy by minimizing the retention of sensitive data.</button>
                    <button
                        class="bg-gray-600 w-[13vw] text-sm hover:bg-gray-700 py-4 px-4 mx-4 my-2 rounded-md">By limiting memory usage, the chatbot optimizes resource allocation, fostering faster processing and smoother performance.</button>
                </div>
                <div class="lim flex flex-col justify-center items-center">
                    <svg stroke="currentColor" fill="none" stroke-width="1.5" viewBox="0 0 24 24" stroke-linecap="round"
                        stroke-linejoin="round" class="h-6 w-6" height="1em" width="1em"
                        xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z">
                        </path>
                        <line x1="12" y1="9" x2="12" y2="13"></line>
                        <line x1="12" y1="17" x2="12.01" y2="17"></line>
                    </svg>
                    <div class="py-2">Limitations</div>
                    <button
                        class="bg-gray-600 w-[13vw] text-sm hover:bg-gray-700 py-4 px-4 mx-4 my-2 rounded-md">The chatbot's limited capacity to remember only three prompts restricts its ability to retain context over extended conversations.</button>
                    <button
                        class="bg-gray-600 w-[13vw] text-sm hover:bg-gray-700 py-4 px-4 mx-4 my-2 rounded-md">Due to its ephemeral memory, the chatbot struggles to sustain long-term engagement with users, potentially leading to repetitive interactions./button>
                    <button
                        class="bg-gray-600 w-[13vw] text-sm hover:bg-gray-700 py-4 px-4 mx-4 my-2 rounded-md"> With a three-prompt limit, there's a heightened risk of crucial information being forgotten prematurely, impacting the accuracy of responses.</button>
                </div>
            </div>
            
        </div>
        <div class="right2 justify-center w-full flex flex-col chat-container">
            <div id="chatContainer" class="chat-content"></div>

                <input id="questionInput2" class="w-full  bg-gray-600 rounded-md" placeholder="Send a message"

                    </svg>
                </button>
            </div> -->
            <div class="chat-input">
                <input id="questionInput2" class="w-full bg-gray-600 rounded-md" placeholder="Send a message" type="text">
                <button id="sendButton2" class="pl-10">
                    <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round"
                        stroke-linejoin="round" class="h-4 w-4 mr-1" height="1em" width="1em" xmlns="http://www.w3.org/2000/svg">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </div>
    </div>
    <script src="/static/js/script.js"></script>
</body>
