    <style>
        body {
        overflow-y: auto; /* Enable vertical scrolling for the entire page */
    }
        .right2 {
            display: none;
        }

        .chat-container {
            flex: 1;
        overflow-y: auto;
        padding: 20px 0;
        max-height: calc(100vh - 100px); /* Adjust the maximum height */
        max-width: calc(100% - 40px); 
            word-wrap: break-word;
        }

        .right2 {
         display: flex;
        flex-direction: column;
        justify-content: center; /* Center the content vertically */
        align-items: center; /* Center the content horizontally */
        padding: 40px; /* Add padding */
        }

        .chat-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px 0;
            max-width: calc(100% - 40px); /* Limit the width of the chat content */
        }

        .chat-input {
            position: fixed;
            bottom: 0;
            left: 40px; /* Adjust left position */
            width: calc(100% - 60px); /* Adjust width */
            padding: 20px;
            background-color: #202123;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }

        .chat-input input {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: none;
            outline: none;
            background-color: #3a3a3a;
            color: white;
        }

        .chat-input button {
            background-color: #3a3a3a;
            border: none;
            padding: 10px;
            margin-left: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-input button svg {
            color: white;
        }

        .chat-box {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .chat-box img {
            border-radius: 50%;
            margin-right: 10px;
        }

        .chat-box.question {
            justify-content: flex-start;
        }

        .chat-box.answer {
            justify-content: flex-end;
        }

        .chat-box .chat-text {
            background-color: #3a3a3a;
            padding: 10px;
            border-radius: 5px;
            max-width: 600px;;
            color: white;
            word-wrap: break-word;
        }
        .chat-box.question .chat-text {
            max-width: 600px; /* Adjust padding */
            min-width: auto; /* Remove min-width */
            width: auto;
            word-wrap: break-word; /* Remove fixed width */
        }

        .chat-box.answer .chat-text {
            max-width: 600px; /* Adjust padding */
            min-width: auto; /* Remove min-width */
            width: auto;
            word-wrap: break-word; /* Remove fixed width */
        }
    </style>
</head>
